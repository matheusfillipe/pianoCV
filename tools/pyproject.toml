[project]
name = "pianocv-tools"
version = "0.0.0"
description = "pianocv offline lab: synthetic keyboard data, frame validation, detector training"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "onnx>=1.22.0",
    "onnxruntime>=1.29.0",
    "onnxscript>=0.7.1",
    "opencv-python-headless==5.0.0.93",
    "torch==2.13.0",
    "torchvision>=0.24",
]

[dependency-groups]
dev = [
    "ruff==0.16.3",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "vulture==2.16",
    "deptry==0.25.1",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "pre-commit==4.6.1",
    "mlflow==3.16.1",
    "cryptography>=50.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pianocv"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RET", "RUF"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
files = ["src/pianocv", "tests"]

[[tool.mypy.overrides]]
# cv2 and onnxruntime ship no type stubs upstream
module = ["cv2", "onnxruntime", "onnxruntime.transformers.float16", "torchvision.models"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# mlflow is optional at runtime (see trainkeynet's guarded import) and ships partial types
module = ["mlflow", "mlflow.data"]
ignore_missing_imports = true

[tool.deptry.per_rule_ignores]
# torch.onnx.export loads it at call time; it is never imported by name
DEP002 = ["onnxscript"]
# trainkeynet imports mlflow only behind --mlflow and runs with it absent, so it stays a dev dependency
DEP004 = ["mlflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["pianocv"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.vulture]
min_confidence = 80

[tool.deptry]
known_first_party = ["pianocv"]

[tool.bandit]
exclude_dirs = ["tests"]
