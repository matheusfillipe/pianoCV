[package]
name = "keycore"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
ort = { version = "=2.0.0-rc.13", optional = true }

[features]
native = ["dep:ort"]

[[example]]
name = "desktop"
required-features = ["native"]

[[example]]
name = "backedge"
required-features = ["native"]

[profile.release]
opt-level = 3
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
